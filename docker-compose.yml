services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000}
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    volumes:
      - posvenda-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  posvenda-data:
