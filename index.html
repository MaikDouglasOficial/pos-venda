<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pós-venda - WhatsApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div class="orb orb-c" aria-hidden="true"></div>

    <header class="app-header">
      <div class="app-brand">
        <div class="topbar-text">
          <span class="topbar-title">Pós-venda</span>
          <span class="topbar-subtitle">WhatsApp rápido</span>
        </div>
      </div>
      <div class="topbar-user">
        <span id="loggedUser" class="topbar-greeting"></span>
        <button type="button" class="btn danger" id="logoutBtn">Sair</button>
      </div>
    </header>

    <main class="content" id="appContent" data-mobile-view="compose">
      <section class="panel compose glass" id="composePanel">
        <div class="panel-heading">
          <p class="panel-kicker">Atendimento do dia</p>
          <h2>Nova mensagem</h2>
        </div>
        <form id="messageForm" class="form" novalidate>
          <div class="field">
            <label for="name">Nome do cliente</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" />
                  <path d="M5 19c1-3.2 3.6-5 7-5s6 1.8 7 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                enterkeyhint="next"
                aria-describedby="nameError"
              />
            </div>
            <small class="error" id="nameError" role="alert" aria-live="assertive"></small>
          </div>

          <div class="field">
            <label for="phone">WhatsApp</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <input
                id="phone"
                name="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="15"
                enterkeyhint="next"
                aria-describedby="phoneError"
              />
            </div>
            <small class="error" id="phoneError" role="alert" aria-live="assertive"></small>
          </div>

          <div class="field">
            <label for="product">Produto comprado</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4.5 8.5 12 4l7.5 4.5v9L12 22l-7.5-4.5v-9Z" stroke="currentColor" stroke-width="1.8" />
                  <path d="M12 12v10M4.5 8.5 12 12l7.5-3.5" stroke="currentColor" stroke-width="1.8" />
                </svg>
              </span>
              <input
                id="product"
                name="product"
                type="text"
                list="productSuggestions"
                autocomplete="off"
                enterkeyhint="done"
              />
            </div>
            <datalist id="productSuggestions"></datalist>
          </div>

          <div class="field toggle-edit">
            <label class="toggle-label" for="creditToggle">
              <span>Venda no crediário</span>
              <input id="creditToggle" type="checkbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>

          <div class="field hidden" id="installmentsField">
            <label for="installments">Quantas parcelas</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="4" y="5" width="16" height="15" rx="2.2" stroke="currentColor" stroke-width="1.8" />
                  <path d="M8 3.5v3M16 3.5v3M4 10h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <input
                id="installments"
                name="installments"
                type="number"
                inputmode="numeric"
                min="2"
                max="48"
                enterkeyhint="done"
                aria-describedby="installmentsError"
              />
            </div>
            <small class="error" id="installmentsError" role="alert" aria-live="assertive"></small>
          </div>

          <div class="field toggle-edit">
            <label class="toggle-label" for="toggleMessage">
              <span>Editar mensagem</span>
              <input id="toggleMessage" type="checkbox" />
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>

          <div class="field">
            <label for="message">Mensagem</label>
            <textarea
              id="message"
              name="message"
              rows="4"
            ></textarea>
            <button type="button" class="btn ghost save-default" id="saveMessageBtn">
              Salvar como padrão
            </button>
          </div>

          <div class="actions">
            <button type="submit" class="btn primary">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.91-7.02Zm-7.01 15.24h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.22-8.23 8.22Zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.12-.17.25-.64.8-.79.97-.15.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.02 2.56.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.17-.48-.29Z" />
              </svg>
              Enviar
            </button>
            <button type="button" class="btn ghost" id="copyBtn">Copiar</button>
          </div>
        </form>
      </section>

      <section class="panel history glass" id="historyPanel">
        <div class="history-header">
          <div class="panel-heading">
            <p class="panel-kicker">Carteira</p>
            <h2>Clientes</h2>
          </div>
          <div class="history-header-actions">
            <button type="button" class="btn ghost compact" id="exportHistoryBtn">
              Exportar
            </button>
            <label class="btn ghost compact import-label">
              Importar
              <input id="importHistoryInput" type="file" accept=".json,application/json" hidden />
            </label>
          </div>
        </div>
        <div class="history-toolbar">
          <div class="search-shell">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
                <path d="M16 16.5 20 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </span>
            <input
              id="historySearch"
              type="search"
              class="history-search"
              placeholder="Buscar nome, telefone ou produto"
              aria-label="Buscar no histórico"
            />
          </div>
          <input
            id="historyDate"
            name="historyDate"
            type="date"
            class="history-filter"
            aria-label="Filtrar por data"
          />
        </div>
        <div class="insight-row" id="insightFilters">
          <button type="button" class="insight-chip" data-insight="yesterday">Ontem</button>
          <button type="button" class="insight-chip" data-insight="credit">Crediário</button>
          <button type="button" class="insight-chip" data-insight="finishing">Terminando de pagar</button>
          <button type="button" class="insight-chip" data-insight="old">Há mais de 1 ano</button>
        </div>
        <div class="history-tabs" role="tablist">
          <button type="button" class="tab-btn active" id="tabClients" data-view="clients">
            Clientes
          </button>
          <button type="button" class="tab-btn" id="tabMessages" data-view="messages">
            Histórico
          </button>
        </div>
        <ul id="historyList" class="history-list"></ul>
        <div id="historyPagination" class="history-pagination"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" class="nav-btn active" id="navCompose" data-mobile-view="compose">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H14l6 6v8.5A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-13Z" stroke="currentColor" stroke-width="1.8" />
            <path d="M14 4v6h6" stroke="currentColor" stroke-width="1.8" />
          </svg>
        </span>
        Enviar
      </button>
      <button type="button" class="nav-btn" id="navClients" data-mobile-view="clients">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8" />
            <path d="M4 19c.6-3 2.6-4.5 5-4.5S13.4 16 14 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="17" cy="9" r="2.2" stroke="currentColor" stroke-width="1.8" />
            <path d="M16.2 19c.3-2 1.5-3.2 3.3-3.2 1 0 1.8.4 2.5 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </span>
        Clientes
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
