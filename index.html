<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1aa75b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pós-venda - WhatsApp</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Pós-venda</ion-title>
          <ion-buttons slot="end">
            <ion-button id="logoutBtn" fill="clear">Sair</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding" id="appContent" data-mobile-view="compose">
        <section id="composePanel">
          <ion-card>
            <ion-card-header>
              <ion-card-subtitle>Atendimento do dia</ion-card-subtitle>
              <ion-card-title>Nova mensagem</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <form id="messageForm" novalidate>
                <ion-item class="field" lines="full">
                  <ion-input id="name" name="name" label="Nome do cliente" label-placement="stacked" autocomplete="name" enterkeyhint="next"></ion-input>
                </ion-item>
                <small class="error" id="nameError" role="alert" aria-live="assertive"></small>

                <ion-item class="field" lines="full">
                  <ion-input id="phone" name="phone" type="tel" inputmode="numeric" label="WhatsApp" label-placement="stacked" autocomplete="tel" maxlength="15" enterkeyhint="next"></ion-input>
                </ion-item>
                <small class="error" id="phoneError" role="alert" aria-live="assertive"></small>

                <ion-item class="field" lines="full">
                  <ion-input id="product" name="product" label="Produto comprado" label-placement="stacked" autocomplete="off" enterkeyhint="done"></ion-input>
                </ion-item>
                <datalist id="productSuggestions"></datalist>

                <ion-item class="field toggle-edit">
                  <ion-label>Venda no crediário</ion-label>
                  <ion-toggle id="creditToggle" slot="end"></ion-toggle>
                </ion-item>

                <ion-item class="field hidden" id="installmentsField" lines="full">
                  <ion-input id="installments" name="installments" type="number" inputmode="numeric" label="Quantas parcelas" label-placement="stacked" min="2" max="48"></ion-input>
                </ion-item>
                <small class="error" id="installmentsError" role="alert" aria-live="assertive"></small>

                <ion-item class="field toggle-edit">
                  <ion-label>Editar mensagem</ion-label>
                  <ion-toggle id="toggleMessage" slot="end"></ion-toggle>
                </ion-item>

                <div class="field" id="messageWrap">
                  <ion-textarea id="message" name="message" label="Mensagem" label-placement="stacked" auto-grow="true" rows="4"></ion-textarea>
                  <ion-button type="button" id="saveMessageBtn" fill="outline" expand="block" size="small">
                    Salvar como padrão
                  </ion-button>
                </div>

                <ion-button type="submit" expand="block">Enviar</ion-button>
                <ion-button type="button" id="copyBtn" fill="outline" expand="block">Copiar</ion-button>
              </form>
            </ion-card-content>
          </ion-card>
        </section>

        <section id="historyPanel">
          <ion-card>
            <ion-card-header>
              <ion-card-subtitle>Carteira</ion-card-subtitle>
              <ion-card-title>Clientes</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <div class="history-header-actions">
                <ion-button type="button" id="exportHistoryBtn" fill="outline" size="small">Exportar</ion-button>
                <label class="import-label">
                  <ion-button type="button" fill="outline" size="small">Importar</ion-button>
                  <input id="importHistoryInput" type="file" accept=".json,application/json" hidden />
                </label>
              </div>

              <ion-item lines="full">
                <ion-input id="historySearch" type="search" label="Buscar" label-placement="stacked" placeholder="Nome, telefone ou produto"></ion-input>
              </ion-item>
              <ion-item lines="full">
                <ion-input id="historyDate" name="historyDate" type="date" label="Data" label-placement="stacked"></ion-input>
              </ion-item>

              <div class="insight-row" id="insightFilters">
                <ion-chip class="insight-chip" data-insight="yesterday">Ontem</ion-chip>
                <ion-chip class="insight-chip" data-insight="credit">Crediário</ion-chip>
                <ion-chip class="insight-chip" data-insight="finishing">Terminando de pagar</ion-chip>
                <ion-chip class="insight-chip" data-insight="old">Há mais de 1 ano</ion-chip>
              </div>

              <ion-segment id="historySegment" value="clients">
                <ion-segment-button value="clients" id="tabClients">Clientes</ion-segment-button>
                <ion-segment-button value="messages" id="tabMessages">Histórico</ion-segment-button>
              </ion-segment>

              <ul id="historyList" class="history-list"></ul>
              <div id="historyPagination" class="history-pagination"></div>
            </ion-card-content>
          </ion-card>
        </section>
      </ion-content>

      <ion-footer>
        <ion-tab-bar>
          <ion-tab-button id="navCompose" class="active" data-mobile-view="compose">
            <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
            <ion-label>Enviar</ion-label>
          </ion-tab-button>
          <ion-tab-button id="navClients" data-mobile-view="clients">
            <ion-icon name="people-outline"></ion-icon>
            <ion-label>Clientes</ion-label>
          </ion-tab-button>
        </ion-tab-bar>
      </ion-footer>
    </ion-app>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
