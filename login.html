<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1aa75b" />
    <title>Pós Venda Facil</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <ion-app>
      <ion-content class="ion-padding">
        <div class="login-wrap">
          <ion-card>
            <ion-card-header>
              <ion-card-subtitle>Painel do vendedor</ion-card-subtitle>
              <ion-card-title>Pós Venda Fácil</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p class="subtitle" id="authSubtitle">Entre para ver seus clientes salvos.</p>
              <form id="loginForm" novalidate>
                <ion-item class="field" lines="full">
                  <ion-input id="username" name="username" label="Usuário" label-placement="stacked" autocomplete="username"></ion-input>
                </ion-item>
                <small class="error" id="userError" role="alert" aria-live="assertive"></small>

                <ion-item class="field" lines="full">
                  <ion-input id="password" name="password" type="password" label="Senha" label-placement="stacked" autocomplete="current-password"></ion-input>
                </ion-item>
                <small class="error" id="passError" role="alert" aria-live="assertive"></small>

                <ion-item class="field hidden" id="confirmField" lines="full">
                  <ion-input id="confirmPassword" name="confirmPassword" type="password" label="Confirmar senha" label-placement="stacked" autocomplete="new-password"></ion-input>
                </ion-item>
                <small class="error" id="confirmError" role="alert" aria-live="assertive"></small>

                <ion-button type="submit" expand="block" id="submitBtn">Entrar</ion-button>
                <ion-button type="button" fill="clear" expand="block" id="authAltBtn">
                  Ainda não tem acesso? Criar agora
                </ion-button>
                <small class="error" id="loginError" role="alert" aria-live="assertive"></small>
              </form>
            </ion-card-content>
          </ion-card>
        </div>
      </ion-content>
    </ion-app>
    <script src="login.js"></script>
  </body>
</html>
